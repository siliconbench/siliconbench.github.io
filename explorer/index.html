<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks — SiliconBench</title>
  <meta name="description" content="Browse all 94 SiliconBench v1.0 tasks by EDA stage, problem type, repository and difficulty.">
  <meta property="og:title" content="SiliconBench Task Explorer">
  <meta property="og:image" content="https://siliconbench.github.io/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Fraunces-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-page="explorer">

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow reveal"><span class="dot"></span>SiliconBench v1.0</span>
    <h1 class="display reveal d1">94 tasks</h1>
    <p class="lede reveal d2">Each task is a real multi-file repository, a written specification and a set of required checks. Open any task to see its spec, editable files and grader.</p>
  </div>
</header>

<section class="wrap" style="padding-bottom:120px">
  <div class="filters reveal">
    <input class="search" id="q" type="search" placeholder="Search by title, repository, file or case ID" autocomplete="off">
    <div class="filter-row" id="f-type" data-key="type"><span class="lab">Type</span></div>
    <div class="filter-row" id="f-solved" data-key="solved"><span class="lab">Difficulty</span></div>
    <div class="filter-row"><span class="lab">Repository</span><select class="select" id="f-repo" aria-label="Repository"></select></div>
  </div>
  <div class="count-line"><span id="count"></span><span id="dot-legend" style="display:inline-flex;gap:10px;flex-wrap:wrap"></span></div>
  <div class="tasks" id="tasks"></div>
</section>

</body>
</html>
